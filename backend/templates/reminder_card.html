<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!--
  539 / 天天樂 開獎提醒卡片 —— 版面模板(資料驅動)。

  這個檔是「設計好的版面」:CSS 定樣式、JS 從 #card-data 這包 JSON 渲染 DOM。
  後端(core.render)把 <script id="card-data"> 的內容換成 backend.reminder_image
  .build_card_data() 產出的 JSON,再用 Chromium 截 #card 這個元素。

  想改版面 → 只動這個檔;想改內容 → 只換 JSON(schema 見 build_card_data 的 docstring)。
  本機預覽:直接用瀏覽器開,會吃下面 DEMO 那包假資料。

  設計:白底、寬版(不強迫瘦長直板)、扁平、克制配色、字級偏大;上方左右兩欄並排,
  10~19 機率與前中後段遺漏走全寬。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { display: inline-block; padding: 20px; }

  :root {
    --ink: #16181d; --sub: #6b7280; --faint: #9aa1ac;
    --line: #e7e9ee; --line2: #eef0f4; --panel: #f7f8fa;
    --brand: #1f3a5f; --warn: #b45309; --warnbg: #fdf6ea; --warnbd: #f0dcae;
    --hot: #c0392b; --hotbg: #fbefec; --hotbd: #ecc7bf;
    --cold: #2f5fd0; --coldbg: #eef2fc; --coldbd: #c6d3f2; --good: #17794b;
  }

  #card {
    width: 1080px;
    font-family: "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei",
      "WenQuanYi Zen Hei", "Noto Color Emoji", sans-serif;
    background: #ffffff; color: var(--ink);
    border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }

  /* ── 標題 ── */
  .head { padding: 30px 40px 24px; border-bottom: 1px solid var(--line); }
  .head .kick { font-size: 14px; letter-spacing: 6px; font-weight: 800; color: var(--brand); }
  .head .title { font-size: 48px; font-weight: 900; margin-top: 8px; line-height: 1.05; }
  .head .meta { margin-top: 14px; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .head .issue { font-size: 25px; font-weight: 800; }
  .head .date { font-size: 20px; font-weight: 600; color: var(--sub); }

  /* ── 開獎號碼(扁平球)── */
  .balls { padding: 26px 40px; display: flex; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .ball { width: 70px; height: 70px; border-radius: 50%; background: #f4c453; color: #3d2b00;
    border: 1px solid #e0ad33; font-size: 30px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; }

  .body { padding: 28px 40px 32px; display: flex; flex-direction: column; gap: 30px; }

  /* ── 兩欄並排(上方)── */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 26px; }

  /* ── 區塊標題 ── */
  .sh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .sh .bar { width: 5px; height: 18px; border-radius: 2px; background: var(--brand); align-self: center; }
  .sh .t { font-size: 21px; font-weight: 900; letter-spacing: .3px; }
  .sh .h { margin-left: auto; font-size: 14px; color: var(--faint); font-weight: 600; }

  /* ── 快照:單雙比 + 9000碰 ── */
  .snap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cell { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; background: #fff; }
  .cell .l { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: var(--sub); }
  .cell .v { font-size: 34px; font-weight: 900; margin-top: 6px; line-height: 1.1; }
  .cell .s { font-size: 15px; margin-top: 5px; color: var(--sub); font-weight: 600; }
  .cell.good { background: #f1f9f4; border-color: #c9e7d6; }
  .cell.good .v { color: var(--good); }
  .cell.warn { background: var(--warnbg); border-color: var(--warnbd); }
  .cell.warn .v { color: var(--warn); }

  /* ── 整合面板 + 子列 ── */
  .panel { border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; background: #fff; }
  .row { display: flex; gap: 16px; align-items: flex-start; padding: 15px 0; }
  .row + .row { border-top: 1px solid var(--line2); }
  .row .lab { flex: 0 0 92px; font-size: 15px; font-weight: 800; color: var(--sub); padding-top: 6px; }
  .row .val { flex: 1; min-width: 0; }

  .chips { display: flex; gap: 9px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 13px;
    font-size: 16px; color: #3a3f4a; font-weight: 600; }
  .chip b { color: var(--ink); font-weight: 900; margin: 0 1px; font-size: 17px; }
  .chip.warn { background: var(--warnbg); border-color: var(--warnbd); color: #8a5a00; }
  .chip.warn b { color: var(--warn); }
  .okline { color: var(--good); font-size: 16px; font-weight: 700; padding: 4px 0; }

  /* ── 10~19 逐號機率(全寬 5 欄)── */
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .oc { border: 1px solid var(--line); background: #fff; border-radius: 14px;
    padding: 16px 8px 13px; text-align: center; position: relative; }
  .oc.warn { border-color: var(--warnbd); background: var(--warnbg); }
  .oc.hot { border-color: var(--hotbd); background: var(--hotbg); }
  .oc.cold { border-color: var(--coldbd); background: var(--coldbg); }
  .oc .tag { position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 800; padding: 2px 10px; border-radius: 8px; white-space: nowrap; }
  .oc .tag.w { background: var(--warn); color: #fff; }
  .oc .tag.h { background: var(--hot); color: #fff; left: auto; right: -5px; transform: none; }
  .oc .tag.c { background: var(--cold); color: #fff; left: -5px; transform: none; }
  .oc .n { font-size: 34px; font-weight: 900; line-height: 1.1; }
  .oc .p1 { margin-top: 7px; font-size: 21px; font-weight: 800; color: #3a3f4a; }
  .oc.hot .p1 { color: var(--hot); }
  .oc.cold .p1 { color: var(--cold); }
  .oc .p2 { font-size: 17px; color: var(--sub); }
  .oc .p3 { margin-top: 4px; font-size: 14px; color: var(--faint); }
  .oc.warn .p3 { color: var(--warn); font-weight: 700; }
  .legend { margin-top: 14px; font-size: 15px; color: var(--sub); line-height: 1.7; }
  .legend .k { display: inline-flex; align-items: center; gap: 6px; margin-right: 18px; }
  .legend .sw { width: 13px; height: 13px; border-radius: 3px; border: 1px solid; }

  /* ── 冷熱號(扁平圓球 + 標籤)── */
  .pills { display: grid; grid-template-columns: repeat(8, 1fr); gap: 9px; }
  .pill { display: flex; flex-direction: column; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 5px 11px; background: #fff; }
  .pb { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 21px; font-weight: 900; }
  .hot .pb { background: var(--hotbg); color: var(--hot); border: 1px solid var(--hotbd); }
  .cold .pb { background: var(--coldbg); color: var(--cold); border: 1px solid var(--coldbd); }
  .pl1 { font-size: 12.5px; color: var(--faint); line-height: 1; }
  .pl2 { font-size: 14px; color: var(--sub); line-height: 1; }
  .pl2 b { font-size: 17px; font-weight: 900; margin: 0 1px; color: var(--ink); }

  /* ── 前中後段遺漏(全寬 3 欄)── */
  .thirds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .third { border: 1px solid var(--line); border-radius: 14px; padding: 15px 15px 17px; background: #fff; }
  .tname { font-size: 15px; font-weight: 900; color: var(--sub); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px; }
  .tname .tbar { width: 20px; height: 4px; border-radius: 2px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .miss { display: inline-flex; align-items: center; gap: 6px; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 4px 11px 4px 4px; }
  .miss .mb { width: 30px; height: 30px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; }
  .miss .mc { font-size: 14px; color: var(--sub); }
  .miss .mc b { color: var(--ink); font-size: 16px; font-weight: 900; margin-right: 1px; }
  .miss.hi { background: var(--warnbg); border-color: var(--warnbd); }
  .miss.hi .mb { background: #d99500 !important; }
  .miss.hi .mc b { color: var(--warn); }
  .miss.none { padding: 6px 12px; color: var(--good); font-size: 15px; font-weight: 700; }

  .foot { padding: 6px 40px 24px; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; color: var(--faint); }
</style>
</head>
<body>
  <div id="card"></div>

  <!-- 後端把這段換成真資料;直接開檔預覽時吃下面的 DEMO。 -->
  <script id="card-data" type="application/json">__CARD_JSON__</script>

  <script>
    const DEMO = {
      game: "今彩539", issue: "114000221", date: "2026-08-28", time: "20:30",
      nums: [3, 12, 20, 25, 31],
      pillars: [
        { name: "第一柱", label: "10~18", current: 4, max_gap: 4, alert: true },
        { name: "第二柱", label: "20~29", current: 0, max_gap: 5, alert: false },
        { name: "第三柱", label: "01~09、19、30~39", current: 1, max_gap: 1, alert: false }
      ],
      singles: [
        { label: "2頭", streak: 3, alert: true },
        { label: "0頭", streak: 1, alert: true }
      ],
      pairs: [
        { a: "0頭", b: "2頭", streak: 4, alert: true },
        { a: "1頭", b: "3頭", streak: 2, alert: false }
      ],
      nine: { streak: 4, max_gap: 21, alert: true },
      thirds: [
        { name: "前段", items: [{ n: 5, miss: 9 }, { n: 8, miss: 4 }, { n: 2, miss: 1 }] },
        { name: "中段", items: [{ n: 17, miss: 6 }] },
        { name: "後段", items: [{ n: 33, miss: 7 }, { n: 39, miss: 3 }] }
      ],
      odd_even: { side: "單多", streak: 2 },
      hotcold: {
        window: 30,
        hot: [{ n: 7, c: 8 }, { n: 12, c: 8 }, { n: 19, c: 8 }, { n: 23, c: 7 },
              { n: 32, c: 7 }, { n: 5, c: 6 }, { n: 35, c: 6 }, { n: 9, c: 5 }],
        cold: [{ n: 15, miss: 36 }, { n: 33, miss: 23 }, { n: 36, miss: 23 }, { n: 3, miss: 16 },
               { n: 13, miss: 15 }, { n: 24, miss: 14 }, { n: 31, miss: 14 }, { n: 1, miss: 13 }]
      }
    };

    function pad2(n) { return String(n).padStart(2, "0"); }

    function readData() {
      const raw = (document.getElementById("card-data").textContent || "").trim();
      if (!raw || raw === "__CARD_JSON__") return DEMO;   // 預覽 / 未注入 → 假資料
      try { return JSON.parse(raw); } catch (_) { return DEMO; }
    }

    function ballsHtml(nums) {
      return (nums || []).map(n => `<span class="ball">${pad2(n)}</span>`).join("");
    }

    // 快照:單雙比 + 9000碰 過關間隔
    function snapHtml(d) {
      const oe = d.odd_even
        ? `<div class="cell"><div class="l">單雙比</div>
             <div class="v">${d.odd_even.side}</div><div class="s">已連續 ${d.odd_even.streak} 期</div></div>`
        : `<div class="cell"><div class="l">單雙比</div>
             <div class="v">—</div><div class="s">最新一期單雙相同</div></div>`;
      let nine;
      if (d.nine) {
        const n = d.nine;
        if (n.streak === 0) {
          nine = `<div class="cell good"><div class="l">9000碰 · 過關間隔</div>
                    <div class="v">本期過關</div><div class="s">四段全開 · 最長槓 ${n.max_gap} 期</div></div>`;
        } else {
          nine = `<div class="cell ${n.alert ? "warn" : ""}"><div class="l">9000碰 · 過關間隔</div>
                    <div class="v">${n.streak} 期未過</div><div class="s">四段沒到齊 · 最長槓 ${n.max_gap} 期</div></div>`;
        }
      } else {
        nine = `<div class="cell"><div class="l">9000碰</div>
                  <div class="v">—</div><div class="s">本款不適用(非 39 選 5)</div></div>`;
      }
      return `<div class="snap">${oe}${nine}</div>`;
    }

    // 1800碰 斷檔(整合):三柱斷柱 + 十位段 + 十位段配對
    function pillar1800Section(d) {
      const hasP = d.pillars && d.pillars.length;
      if (!hasP && !(d.singles && d.pairs)) return "";
      const pillarChips = hasP ? d.pillars.map(p =>
        `<span class="chip ${p.alert ? "warn" : ""}">${p.name} ${p.label} <b>${p.current}</b>期沒開</span>`).join("") : "";
      const singleChips = (d.singles && d.singles.length)
        ? `<div class="chips">${d.singles.map(s =>
            `<span class="chip ${s.alert ? "warn" : ""}">${s.label} <b>${s.streak}</b>期沒開</span>`).join("")}</div>`
        : `<div class="okline">各十位段近期都有開 ✓</div>`;
      const pairChips = (d.pairs && d.pairs.length)
        ? `<div class="chips">${d.pairs.map(p =>
            `<span class="chip ${p.alert ? "warn" : ""}">${p.a}·${p.b} <b>${p.streak}</b>期</span>`).join("")}</div>`
        : `<div class="okline">各十位段配對近期都有一起開 ✓</div>`;
      const warnN = hasP ? d.pillars.filter(p => p.alert).length : 0;
      const hint = warnN ? `${warnN} 柱達 4 期示警` : "任一柱斷 4 期未過關";
      const pillarRow = hasP
        ? `<div class="row"><div class="lab">三柱斷柱</div><div class="val"><div class="chips">${pillarChips}</div></div></div>` : "";
      return `<div class="sec">
        <div class="sh"><span class="bar"></span><span class="t">1800碰 · 斷檔追蹤</span><span class="h">${hint}</span></div>
        <div class="panel">
          ${pillarRow}
          <div class="row"><div class="lab">十位段</div><div class="val">${singleChips}</div></div>
          <div class="row"><div class="lab">十位段配對</div><div class="val">${pairChips}</div></div>
        </div></div>`;
    }

    // 10~19 逐號機率(全寬;精簡:號碼格 + 一行圖例)
    function numOddsSection(o) {
      if (!o || !o.numbers || !o.numbers.length) return "";
      const shorts = o.numbers.map(x => x.short);
      const maxS = Math.max(...shorts), minS = Math.min(...shorts);
      const cells = o.numbers.map(x => {
        const s = (x.short * 100).toFixed(0), l = (x.long * 100).toFixed(1);
        const pr = (x.pressure * 100).toFixed(0);
        const top = x.pressure > o.pa, hot = x.short === maxS, cold = x.short === minS;
        const cls = top ? "warn" : hot ? "hot" : cold ? "cold" : "";
        const tag = top ? `<span class="tag w">壓 ${pr}%</span>`
          : hot ? `<span class="tag h">最高</span>` : cold ? `<span class="tag c">最低</span>` : "";
        return `<div class="oc ${cls}">${tag}
          <div class="n">${pad2(x.n)}</div>
          <div class="p1">短 ${s}%</div>
          <div class="p2">長 ${l}%</div>
          <div class="p3">壓 ${pr}% · 遺 ${x.gap}/${x.max_gap}</div></div>`;
      }).join("");
      return `<div class="sec">
        <div class="sh"><span class="bar"></span><span class="t">10~19 逐號機率</span>
          <span class="h">短:近${o.rw}期 · 長:近${o.lw}期 · 理論 ${(o.theo * 100).toFixed(2)}%</span></div>
        <div class="grid5">${cells}</div>
        <div class="legend">
          <span class="k"><span class="sw" style="background:var(--warnbg);border-color:var(--warnbd)"></span>回補壓力&gt;${(o.pa*100).toFixed(0)}%(非真實機率)</span>
          <span class="k"><span class="sw" style="background:var(--hotbg);border-color:var(--hotbd)"></span>短期最高</span>
          <span class="k"><span class="sw" style="background:var(--coldbg);border-color:var(--coldbd)"></span>短期最低</span>
          <div style="margin-top:6px">機率經貝式平滑向理論值收斂;短期僅近況、每期獨立,真實機率約 ${(o.theo * 100).toFixed(2)}%。</div>
        </div></div>`;
    }

    // 冷熱號(熱 + 冷,一個面板)
    function hotColdSection(hc) {
      if (!hc) return "";
      const hotPills = (hc.hot || []).map(x =>
        `<div class="pill hot"><div class="pb">${pad2(x.n)}</div>
           <div class="pl1">近${hc.window}期</div><div class="pl2">開 <b>${x.c}</b> 次</div></div>`).join("");
      const coldPills = (hc.cold || []).map(x =>
        `<div class="pill cold"><div class="pb">${pad2(x.n)}</div>
           <div class="pl1">未開</div><div class="pl2"><b>${x.miss}</b> 期</div></div>`).join("");
      return `<div class="sec">
        <div class="sh"><span class="bar"></span><span class="t">冷熱號</span><span class="h">近 ${hc.window} 期</span></div>
        <div class="panel">
          <div class="row"><div class="lab" style="color:var(--hot)">熱號 · 追熱</div><div class="val"><div class="pills">${hotPills}</div></div></div>
          <div class="row"><div class="lab" style="color:var(--cold)">冷號 · 養牌</div><div class="val"><div class="pills">${coldPills}</div></div></div>
        </div></div>`;
    }

    // 前中後段遺漏(全寬 3 欄)
    function thirdsSection(thirds) {
      if (!thirds || !thirds.length) return "";
      const bars = { "前段": "#5c8cff", "中段": "#9b6dff", "後段": "#e06db0" };
      const cols = thirds.map(t => {
        const bar = bars[t.name] || "#8a90a0";
        const badges = (t.items && t.items.length)
          ? t.items.map(it =>
              `<span class="miss ${it.miss >= 8 ? "hi" : ""}"><span class="mb" style="background:${bar}">${pad2(it.n)}</span><span class="mc"><b>${it.miss}</b>期</span></span>`).join("")
          : `<span class="miss none">近期都有開 ✓</span>`;
        return `<div class="third">
          <div class="tname"><span class="tbar" style="background:${bar}"></span>${t.name}</div>
          <div class="badges">${badges}</div></div>`;
      }).join("");
      return `<div class="sec">
        <div class="sh"><span class="bar"></span><span class="t">前中後段 · 目前遺漏</span>
          <span class="h">球號／已幾期沒開(≥8 標黃)</span></div>
        <div class="thirds">${cols}</div></div>`;
    }

    function render(d) {
      const metaTime = d.time ? ` · ${d.time}` : "";
      const numsLabel = d.nums_label
        ? `<div class="sh" style="margin:2px 0 6px"><span class="bar"></span>`
          + `<span class="t">${d.nums_label}</span></div>` : "";
      const noteLine = d.note
        ? `<div class="date" style="margin-top:6px">${d.note}</div>` : "";
      document.getElementById("card").innerHTML = `
        <div class="head">
          <div class="kick">${d.kick || "開獎提醒"}</div>
          <div class="title">${d.game}</div>
          <div class="meta">
            <span class="issue">第 ${d.issue} 期</span>
            <span class="date">${d.date}${metaTime}</span>
          </div>
          ${noteLine}
        </div>
        ${numsLabel}
        <div class="balls">${ballsHtml(d.nums)}</div>
        <div class="body">
          ${snapHtml(d)}
          ${pillar1800Section(d)}
          ${numOddsSection(d.num_odds)}
          ${hotColdSection(d.hotcold)}
          ${thirdsSection(d.thirds)}
        </div>
        <div class="foot"><span>539 / 天天樂 損益儀表板</span><span>${d.date}${metaTime}</span></div>`;
      document.documentElement.setAttribute("data-ready", "1");
    }

    render(readData());
  </script>
</body>
</html>
